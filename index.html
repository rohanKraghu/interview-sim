<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Sim</title>
<style>
  :root {
    --bg: #fafaf8; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e4e3de;
    --accent: #2f6f5e; --warn: #b4552d; --code-bg: #f4f3ef;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a9993; --line: #33332f;
      --accent: #6cc2a8; --warn: #e08a62; --code-bg: #1a1a18;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  button, input, select { font: inherit; }
  button { background: var(--accent); color: var(--bg); border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  button.quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  input, select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }

  #setup { max-width: 440px; margin: 12vh auto; padding: 0 16px; display: grid; gap: 14px; }
  #setup h1 { margin: 0; font-size: 28px; }
  #setup p { margin: 0; color: var(--muted); }
  #setup label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }

  #room { height: 100vh; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h2 { margin: 0; font-size: 17px; flex: 1; }
  #timer { font-variant-numeric: tabular-nums; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .dot.live { background: var(--accent); }
  .dot.talking { background: var(--warn); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot.talking { animation: none; } }

  main { display: grid; grid-template-columns: minmax(280px, 1fr) 2fr; min-height: 0; }
  aside { display: grid; grid-template-rows: auto 1fr auto; border-right: 1px solid var(--line); min-height: 0; }
  #statement { margin: 0; padding: 16px; white-space: pre-wrap; border-bottom: 1px solid var(--line); }
  #transcript { overflow-y: auto; padding: 8px 16px; }
  #transcript p { margin: 8px 0; }
  #transcript .interviewer { color: var(--accent); }
  #transcript .candidate { color: var(--ink); }
  #transcript .candidate::before { content: "You: "; color: var(--muted); }
  .talk { padding: 12px 16px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
  #caption { min-height: 1.5em; color: var(--muted); font-style: italic; margin: 0; }
  #say { width: 100%; }
  #status { color: var(--warn); font-size: 14px; margin: 0; }
  #editor { width: 100%; height: 100%; resize: none; border: 0; outline: 0; padding: 16px;
    background: var(--code-bg); color: var(--ink); font: 15px/1.6 ui-monospace, Menlo, Consolas, monospace; tab-size: 4; }

  #card { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 85%, transparent); display: grid; place-items: center; padding: 16px; }
  #card > div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; width: min(620px, 100%); max-height: 90vh; overflow-y: auto; }
  #card h3 { margin: 18px 0 4px; font-size: 15px; }
  .verdict { font-size: 22px; font-weight: 600; text-transform: capitalize; margin: 0 0 4px; }
  .score { display: grid; grid-template-columns: 1fr auto; padding: 10px 0; border-top: 1px solid var(--line); }
  .dim { text-transform: capitalize; font-weight: 500; }
  .pts { font-variant-numeric: tabular-nums; }
  .s1, .s2 { color: var(--warn); } .s3, .s4 { color: var(--accent); }
  .evidence { grid-column: 1 / -1; margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  @media (max-width: 760px) {
    #room { height: auto; }
    main { grid-template-columns: 1fr; }
    aside { border-right: 0; }
    #transcript { max-height: 40vh; }
    #editor { height: 60vh; }
  }
</style>
</head>
<body>
<section id="setup">
  <h1>Interview Sim</h1>
  <p>A voice interviewer for one coding problem. It listens, nudges you when you go quiet, asks about the code you write, and pushes back when a claim is wrong. Use Chrome or Edge, and headphones if you can.</p>
  <label>Problem <select id="problem"></select></label>
  <label>Anthropic API key <input id="key" type="password" autocomplete="off" placeholder="sk-ant-..."></label>
  <p style="font-size:14px">The key stays in this browser and is sent only to api.anthropic.com.</p>
  <button id="start">Start interview</button>
</section>

<section id="room" hidden>
  <header>
    <span id="dot" class="dot" title="Microphone"></span>
    <h2 id="title"></h2>
    <span id="timer"></span>
    <button id="end" class="quiet">End interview</button>
  </header>
  <main>
    <aside>
      <p id="statement"></p>
      <div id="transcript" aria-live="polite"></div>
      <div class="talk">
        <p id="caption"></p>
        <input id="say" placeholder="Talk, or type here and press Enter">
        <p id="status"></p>
      </div>
    </aside>
    <textarea id="editor" spellcheck="false" placeholder="Write your solution here, in any language." aria-label="Code editor"></textarea>
  </main>
</section>

<section id="card" hidden>
  <div><div id="card-body"></div></div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
